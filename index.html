<!-- index.html (add Doodle Jump to your Game Hub) -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Hub</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#22d3ee;--accent-2:#06b6d4;--ring:#f59e0b;--shadow:0 10px 25px rgba(0,0,0,.35);--radius:16px}
    *{box-sizing:border-box}html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial;background:radial-gradient(1200px 800px at 20% -10%,#13213a 0%,var(--bg) 60%) fixed;color:var(--text);display:flex;flex-direction:column;gap:24px}
    header{padding:32px 20px 0;text-align:center}
    h1{margin:0 0 6px;letter-spacing:.3px;font-size:clamp(28px,3vw,42px)}
    .sub{margin:0 auto;color:var(--muted);max-width:66ch;font-size:clamp(14px,1.6vw,16px)}
    .grid{width:min(1100px,92%);margin:8px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.06);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .12s ease,border-color .12s ease}
    .card:focus-within,.card:hover{transform:translateY(-2px);border-color:rgba(34,211,238,.35)}
    .title{font-size:18px;margin:0 0 2px}
    .desc{margin:0 0 8px;color:var(--muted);min-height:40px;line-height:1.3}
    .play{align-self:flex-start;appearance:none;border:none;border-radius:12px;padding:10px 14px;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#042026;font-weight:700;cursor:pointer;box-shadow:0 12px 24px rgba(6,182,212,.25)}
    .play:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
    footer{margin-top:auto;padding:18px 20px 28px;color:var(--muted);text-align:center;font-size:14px}
    .small{font-size:13px;color:#9ca3af}a{color:var(--accent)}
  </style>
</head>
<body>
  <header>
    <h1>Game Hub</h1>
    <p class="sub">Launch <strong>Pong</strong>, <strong>Snake</strong>, <strong>Space Invaders</strong>, or <strong>Doodle Jump</strong>. Add more by editing one array.</p>
  </header>

  <main class="grid" id="grid" aria-live="polite" aria-busy="false"></main>

  <footer>
    <div>Tip: From any game, use the in-game menu to return here.</div>
    <div class="small">No installs. No trackers. Just vanilla HTML/CSS/JS.</div>
  </footer>

  <script>
    const GAMES = [
      { id:'pong',    title:'Pong',            description:'Classic paddle game. Keyboard or touch.', href:'pong.html' },
      { id:'snake',   title:'Snake',           description:'Grow the snake. Don’t hit walls or yourself.', href:'snake.html' },
      { id:'inv',     title:'Space Invaders',  description:'Defend Earth. Move & shoot. Shields help.', href:'space-invaders.html' },
      { id:'doodle',  title:'Doodle Jump',     description:'Bounce up forever. Power-ups included!', href:'doodle-jump.html' },
    ];
    (function renderCatalog(){
      const grid=document.getElementById('grid'); grid.setAttribute('aria-busy','true');
      for(const g of GAMES){
        const card=document.createElement('article'); card.className='card'; card.tabIndex=0; card.setAttribute('role','region');
        const h2=Object.assign(document.createElement('h2'),{className:'title',textContent:g.title});
        const p=Object.assign(document.createElement('p'),{className:'desc',textContent:g.description});
        const btn=Object.assign(document.createElement('button'),{className:'play',type:'button',textContent:'Play'});
        btn.setAttribute('aria-label',`Play ${g.title}`); btn.addEventListener('click',()=>location.href=g.href);
        card.append(h2,p,btn); grid.appendChild(card);
      }
      grid.setAttribute('aria-busy','false');
    })();
  </script>
</body>
</html>
